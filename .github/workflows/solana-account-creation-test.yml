name: Solana account-creation regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/solana-sponsor-ata-owner-guard']
  workflow_dispatch:

jobs:
  solana-account-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Report production dependency advisories
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Test real account-creation rewrite
        run: node --experimental-strip-types scripts/test-solana-account-creation.mjs
      - name: Typecheck
        run: npm run typecheck
      - run: npm run verify
      - run: npm run verify:wallet
      - run: npm run verify:wallet-cipher
      - run: npm run verify:sign-guard
      - run: npm run verify:relay-intent
      - run: npm run verify:solana-output
      - run: npm run verify:diagnostic-redaction
      - run: npm run verify:one-click
      - run: npm run verify:one-click-deposits
      - run: npm run verify:near-account
      - run: npm run verify:near-signing
