name: Dependency remediation attempt
on:
  push:
    branches:
      - fix/audit-activity-list-rendering
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-activity-list-rendering
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking npm audit fixes
        continue-on-error: true
        run: npm audit fix
      - name: Capture dependency audit report
        if: always()
        run: npm audit --json > dependency-audit.json || true
      - name: Typecheck
        run: npm run typecheck
      - name: Run wallet and trading regression checks
        run: |
          node scripts/verify-mango-parity.mjs
          node --experimental-strip-types scripts/verify-mango-wallet.mjs
          node --experimental-strip-types scripts/verify-wallet-cipher.mjs
          node --experimental-strip-types scripts/verify-sign-guard.mjs
          node --experimental-strip-types scripts/verify-relay-intent.mjs
          node --experimental-strip-types scripts/verify-solana-output-guard.mjs
          node --experimental-strip-types scripts/verify-diagnostic-redaction.mjs
          node --experimental-strip-types scripts/verify-one-click.mjs
          node --experimental-strip-types scripts/verify-one-click-deposits.mjs
          node --experimental-strip-types scripts/verify-near-account.mjs
          node --experimental-strip-types scripts/verify-near-signing.mjs
      - name: Build Android JavaScript bundle
        run: |
          mkdir -p /tmp/kivo-android-bundle
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/kivo-android-bundle/index.android.bundle --assets-dest /tmp/kivo-android-bundle
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile remediation
        if: success()
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Fix production dependency advisories without breaking SDK versions"
          git push origin HEAD:fix/audit-activity-list-rendering
      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-diagnostics
          path: |
            dependency-audit.json
            package.json
            package-lock.json
          if-no-files-found: warn
