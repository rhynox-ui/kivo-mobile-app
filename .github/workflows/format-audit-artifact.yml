name: Audit source formatting artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - name: Format audit review files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/wallet/EnableBiometricModal.tsx
            src/screens/ImportWalletScreen.tsx
            src/screens/RecoveryBackupScreen.tsx
            src/screens/SecurityScreen.tsx
            src/screens/LegacyMigrationScreen.tsx
            src/screens/ProfileSetupScreen.tsx
            src/navigation/RootNavigator.tsx
            src/components/KivoAlert.tsx
            src/components/KivoAvatar.tsx
            src/components/KivoBadge.tsx
            src/components/KivoButton.tsx
            src/components/KivoCard.tsx
            src/components/KivoDivider.tsx
            src/components/KivoHeader.tsx
            src/components/KivoIconButton.tsx
            src/components/KivoInput.tsx
            src/components/KivoMark.tsx
            src/components/KivoModal.tsx
            src/components/KivoPill.tsx
            src/components/KivoSection.tsx
            src/components/KivoStat.tsx
            src/components/KivoText.tsx
          )
          npx --yes prettier@3.6.2 --write --single-quote --trailing-comma all --print-width 100 "${files[@]}"
          for file in "${files[@]}"; do
            mkdir -p "/tmp/formatted/$(dirname "$file")"
            cp "$file" "/tmp/formatted/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: audit-formatted-source
          path: /tmp/formatted/
          if-no-files-found: error
