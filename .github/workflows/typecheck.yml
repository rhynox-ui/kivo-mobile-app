name: Kivo Mobile Typecheck

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Reject tracked release keystores
        shell: bash
        run: |
          release_keystores="$(git ls-files '*.keystore' '*.jks' | grep -v '^android/app/debug.keystore      - name: Verify Jupiter sell fee accounting
        run: node --experimental-strip-types scripts/verify-jupiter-sell-net-output.mjs
      - name: Bundle Android JavaScript
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/assets
 || true)"
          if [ -n "$release_keystores" ]; then
            printf 'Unexpected tracked release keystore(s):\\n%s\\n' "$release_keystores"
            exit 1
          fi
      - run: npm run verify
      - run: npm run verify:wallet
      - run: npm run verify:wallet-cipher
      - run: npm run verify:sign-guard
      - run: npm run verify:relay-intent
      - run: npm run verify:solana-output
      - run: npm run verify:diagnostic-redaction
      - run: npm run verify:one-click
      - run: npm run verify:one-click-deposits
      - run: npm run verify:near-account
      - run: npm run verify:near-signing
      - name: Verify Jupiter sell fee accounting
        run: node --experimental-strip-types scripts/verify-jupiter-sell-net-output.mjs
      - name: Bundle Android JavaScript
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/assets
