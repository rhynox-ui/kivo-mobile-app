name: Kivo Android APK Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version"
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: "Android version code"
        required: true
        default: "1"
        type: string
  push:
    branches:
      - main

concurrency:
  group: kivo-mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/kivo-release.keystore
          test -s android/app/kivo-release.keystore

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: kivo-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PVERSION_NAME="${{ inputs.version_name || '0.1.0' }}" -PVERSION_CODE="${{ inputs.version_code || '1' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: kivo-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f android/app/kivo-release.keystore
