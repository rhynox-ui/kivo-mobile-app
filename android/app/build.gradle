apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../..")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def appVersionCode = project.hasProperty("VERSION_CODE") ? project.property("VERSION_CODE").toString().toInteger() : 1
def appVersionName = project.hasProperty("VERSION_NAME") ? project.property("VERSION_NAME").toString() : "0.1.0"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.kivo.chat"

    buildFeatures { buildConfig true }

    def fcmProjectId = (System.getenv("KIVO_FCM_PROJECT_ID") ?: "").replace("\\", "\\\\").replace('"', '\\"')
    def fcmAppId = (System.getenv("KIVO_FCM_APP_ID") ?: "").replace("\\", "\\\\").replace('"', '\\"')
    def fcmApiKey = (System.getenv("KIVO_FCM_API_KEY") ?: "").replace("\\", "\\\\").replace('"', '\\"')
    def fcmSenderId = (System.getenv("KIVO_FCM_SENDER_ID") ?: "").replace("\\", "\\\\").replace('"', '\\"')

    defaultConfig {
        buildConfigField "String", "KIVO_FCM_PROJECT_ID", "\"${fcmProjectId}\""
        buildConfigField "String", "KIVO_FCM_APP_ID", "\"${fcmAppId}\""
        buildConfigField "String", "KIVO_FCM_API_KEY", "\"${fcmApiKey}\""
        buildConfigField "String", "KIVO_FCM_SENDER_ID", "\"${fcmSenderId}\""
        applicationId "com.kivotrade.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        // Phone CPUs only (x86_64 is for emulators/Chromebooks). Every native
        // library must be 16 KB aligned for Google Play (scripts/check-apk-16kb.py);
        // react-native-keychain 10 dropped the old Conceal library that wasn't.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def releaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.2.0")
    implementation("com.google.firebase:firebase-messaging")
    implementation("com.facebook.react:react-android")
    implementation("com.android.installreferrer:installreferrer:2.2")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
}
